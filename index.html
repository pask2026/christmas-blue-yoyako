<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060d1f">
<title>蓝色圣诞 · 鱼与雨yoyako</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060d1f;color:#cfe8ff}body{font-family:Georgia,'Times New Roman',serif}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}main{position:relative;width:100%;height:100%;height:100svh;background:radial-gradient(ellipse at 50% 60%,#1a3a7a 0, #0e2348 42%,#060d1c 85%)}header{position:absolute;z-index:2;top:max(35px,env(safe-area-inset-top));left:7%;right:7%;display:flex;align-items:center;justify-content:space-between;font:10px/1.5 Arial,sans-serif;letter-spacing:3px;color:#a3bfef}header span:first-child{color:#4da6ff}header span:last-child{letter-spacing:2px;font-size:9px}.intro{position:absolute;z-index:2;top:14%;width:100%;text-align:center;pointer-events:none}.eyebrow{font:9px Arial,sans-serif;letter-spacing:5px;color:#a8cdf7}h1{font-size:clamp(36px,6.2vw,65px);font-weight:400;font-style:italic;margin:13px 0 10px;letter-spacing:-2px;text-shadow:0 0 35px #4da6ff55}.sub{font:11px/1.8 Arial,'Microsoft YaHei',sans-serif;letter-spacing:4px;color:#a8cdf7}.footer{position:absolute;z-index:2;bottom:max(26px,env(safe-area-inset-bottom));width:100%;text-align:center}.wish{font-size:14px;font-style:italic;color:#4da6ff;letter-spacing:1px;margin-bottom:18px}.controls{display:flex;justify-content:center;gap:9px}button{cursor:pointer;border:1px solid #4da6ff41;border-radius:30px;padding:10px 16px;background:#ffffff05;color:#a8cdf7;font:10px Arial,'Microsoft YaHei',sans-serif;letter-spacing:1px;backdrop-filter:blur(12px);transition:background .2s,color .2s}button:hover,button:focus-visible{background:#4da6ff24;color:#fff;outline:1px solid #4da6ff}button[aria-pressed=true]{border-color:#4da6ff7a;color:#e6f6ff}.hint{font:9px Arial,'Microsoft YaHei',sans-serif;color:#8fa3c7;letter-spacing:2px;margin-top:16px}.sign{font:15px/1.9 'Microsoft YaHei',Georgia,'Times New Roman',serif;font-style:italic;letter-spacing:4px;color:#4da6ff;margin-top:16px;text-shadow:0 0 22px #4da6ff66}@media(max-height:620px){.intro{top:12%}h1{font-size:32px;margin:8px}.sub{font-size:9px}.wish,.hint{display:none}.footer{bottom:15px}header{top:18px}}@media(max-width:500px){header{left:7%;right:7%;font-size:9px;letter-spacing:2px}.intro{top:14%}header span:last-child{font-size:8px;letter-spacing:1px}.sub{letter-spacing:3px}h1{margin-top:16px}.wish{font-size:13px}.hint{font-size:8px}}
.controls{flex-wrap:wrap;padding:0 16px}.footer{pointer-events:none}.footer button,.footer input,.panel{pointer-events:auto}.panel{position:absolute;right:22px;bottom:125px;width:260px;padding:22px;border:1px solid #4da6ff3d;border-radius:20px;background:#0c1d3ded;backdrop-filter:blur(22px);text-align:left;box-shadow:0 15px 70px #0008;font:12px Arial,'Microsoft YaHei',sans-serif}.panel[hidden]{display:none}.panel label{display:block;margin:0 0 17px;color:#cfe8ff}.panel label span{float:right;color:#4da6ff}input[type=range]{display:block;width:100%;accent-color:#4da6ff;margin:13px 0 0;cursor:pointer}.panel .row{display:flex;gap:8px}.panel .row button{flex:1}.panel h2{font-size:13px;font-weight:400;letter-spacing:3px;margin:0 0 23px}.zoom-controls{position:absolute;right:24px;top:48%;z-index:2;display:grid;gap:8px}.zoom-controls button{width:38px;height:38px;padding:0;font-size:18px}.zoom-controls output{font:10px Arial;text-align:center;color:#a8cdf7}.immersive header,.immersive .intro,.immersive .wish{opacity:0;pointer-events:none}header,.intro,.wish{transition:opacity .6s}canvas{cursor:grab}canvas:active{cursor:grabbing}@media(max-width:500px){.controls{gap:6px}.controls button{padding:10px 12px;font-size:10px}.panel{right:15px;bottom:140px;width:min(280px,calc(100vw - 30px))}.zoom-controls{right:12px;top:44%}.zoom-controls button{width:32px;height:32px}.wish{margin-bottom:14px}.hint{letter-spacing:1px}}@media(max-height:620px){.panel{bottom:65px;padding:15px}.panel label{margin-bottom:10px}.panel h2{margin-bottom:12px}.controls button{padding:8px 12px}}
</style>
</head>
<body>
<main aria-label="蓝色荧光粒子圣诞树，轻轻旋转，周围飘落雪花">
<canvas id="scene" aria-hidden="true"></canvas>
<header><span>✧ &nbsp; THE BLUE NOËL</span><span>WINTER COLLECTION · 2026</span></header>
<div class="intro"><div class="eyebrow">A LITTLE MAGIC, JUST FOR YOU</div><h1>Christmas in blue.</h1><div class="sub">把冬夜，点亮成蓝色的祝福</div>
<div class="sign">—— 鱼与雨yoyako</div></div>
<div class="zoom-controls"><button id="zoomIn" aria-label="放大圣诞树">+</button><output id="zoomValue" aria-live="polite">100%</output><button id="zoomOut" aria-label="缩小圣诞树">−</button></div>
<div class="footer"><div class="wish">May your days be soft, bright & full of wonder.</div><div class="controls"><button id="snow" aria-pressed="true">❄ 飘雪</button><button id="rotate" aria-pressed="true">✧ 旋转</button><button id="wish">♡ 许愿烟花</button><button id="settings" aria-expanded="false" aria-controls="panel">☷ 氛围</button><button id="immersive" aria-pressed="false">◈ 沉浸</button></div><div class="hint" id="hint" aria-live="polite">拖动旋转 · 滚轮 / 双指缩放 · 轻触洒落星光</div>
<section class="panel" id="panel" aria-label="氛围设置" hidden><h2>MAKE IT YOUR MAGIC</h2><label>雪量 <span id="densityLabel">大雪</span><input id="density" type="range" min="0" max="100" value="75"></label><label>风力 <span id="windLabel">40%</span><input id="wind" type="range" min="0" max="100" value="40"></label><label>旋转速度 <span id="speedLabel">60%</span><input id="speed" type="range" min="0" max="100" value="60"></label><label>荧光亮度 <span id="lightLabel">100%</span><input id="light" type="range" min="40" max="170" value="100"></label><div class="row"><button id="storm">❄ 暴风雪</button><button id="reset">↺ 复位</button><button id="fullscreen">⛶ 全屏</button></div></section></div>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
let w,h,dpr,cx,top,th,radius,angle=0,last=0,now=0,snowOn=true,rotating=true;
let zoom=1,targetZoom=1,tilt=0,velocity=0,density=.75,wind=.4,speed=.6,brightness=1,stormUntil=0;
const pointers=new Map();let pinch=0,dragged=false,startPoint=null;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let paused=false;
const random=(a,b)=>a+Math.random()*(b-a);
const dots=Array.from({length:3600},()=>{const v=Math.pow(Math.random(),.78),theta=random(0,Math.PI*2);return{v,theta,r:.65+Math.random()*.35,size:random(.5,1.6),phase:random(0,6.28)}});
const flakes=Array.from({length:650},()=>({x:Math.random(),y:Math.random(),s:random(.7,5.5),speed:random(.035,.15),phase:random(0,6.28)}));
const bursts=[];
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);cx=w/2;top=h*.32;th=h*.49;radius=Math.min(w*.37,th*.53,280)}
addEventListener('resize',resize);resize();
const sprite=document.createElement('canvas');sprite.width=sprite.height=64;const sc=sprite.getContext('2d'),gr=sc.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'#e8f6ff');gr.addColorStop(.12,'#bfe3ff');gr.addColorStop(.3,'#4da6ff99');gr.addColorStop(1,'#1a6bff00');sc.fillStyle=gr;sc.fillRect(0,0,64,64);
function glow(x,y,s,alpha){ctx.globalAlpha=Math.min(1,Math.max(0,alpha*brightness));ctx.drawImage(sprite,x-s,y-s,s*2,s*2)}
function project(v,theta,r=1){const tier=1-.2*Math.pow(1-((v*9)%1),1.5);const rr=radius*Math.pow(v,.88)*r*tier,a=theta+angle;return{x:cx+Math.cos(a)*rr,y:top+th*v+Math.sin(a)*rr*(.22+tilt),z:Math.sin(a)}}
function star(x,y){const pulse=1+Math.sin(now*1.6)*.06;glow(x,y,85*pulse,.27);glow(x,y,36*pulse,.7);ctx.save();ctx.translate(x,y);ctx.scale(pulse,pulse);ctx.shadowColor='#4da6ff';ctx.shadowBlur=22;ctx.fillStyle='#e8f6ff';ctx.globalAlpha=1;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?8:21;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#bfe3ff';ctx.lineWidth=.7;ctx.globalAlpha=.65;ctx.beginPath();ctx.moveTo(-46,0);ctx.lineTo(46,0);ctx.moveTo(0,-40);ctx.lineTo(0,40);ctx.stroke();ctx.rotate(now*.12);for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);ctx.globalAlpha=.25;ctx.beginPath();ctx.moveTo(29,0);ctx.lineTo(48+(i%2)*16,0);ctx.stroke()}ctx.restore()}
function atmosphere(){const x=cx,y=top+th*.6;const aura=ctx.createRadialGradient(x,y,0,x,y,th*.8);aura.addColorStop(0,'#4da6ff2b');aura.addColorStop(.5,'#3b8fff12');aura.addColorStop(1,'#1a6bff00');ctx.globalAlpha=1;ctx.fillStyle=aura;ctx.fillRect(cx-th,top-th*.3,th*2,th*1.7);
// Thin, slowly breathing shafts of light frame the luminous silhouette.
for(let i=0;i<7;i++){const wave=Math.sin(now*.22+i)*.08;ctx.globalAlpha=.025+.012*Math.sin(now*.7+i);ctx.fillStyle='#4da6ff';ctx.beginPath();ctx.moveTo(cx+Math.sin(i*3.3)*radius*.5,top+th+15);ctx.lineTo(cx+Math.sin(i*2.4+wave)*radius*2,top-th*.25);ctx.lineTo(cx+Math.sin(i*2.4+wave)*radius*2+30,top-th*.25);ctx.closePath();ctx.fill()}}
function orbit(front){for(let ring=0;ring<3;ring++){const rv=.3+ring*.28;for(let i=0;i<100;i++){const a=i/100*Math.PI*2+now*(.12+ring*.035)*(ring%2?-1:1);if((Math.sin(a)>0)!==front)continue;const rr=radius*(rv+.28);const x=cx+Math.cos(a)*rr,y=top+th*rv+Math.sin(a)*rr*.25;glow(x,y,i%12===0?4:1.5,(i%12===0?.65:.15)*(front?1:.55))}}}
function drawSnow(front,dt){if(!snowOn)return;const storm=now<stormUntil;const count=Math.floor(flakes.length*(storm?1:density));ctx.fillStyle='#f0f8ff';ctx.strokeStyle='#f0f8ff';
for(let i=0;i<count;i++){const f=flakes[i];if((f.s>3.6)!==front)continue;
if(!paused){f.y+=f.speed*dt*(storm?2.2:1);f.x+=((storm?.24:wind*.1)*(f.s/3)+Math.sin(now+f.phase)*.012)*dt;if(f.y>1.04){f.y=-.04;f.x=Math.random()}if(f.x>1.05)f.x=-.05;if(f.x<-.05)f.x=1.05}
const x=f.x*w,y=f.y*h,size=f.s*(front?1.25:1);ctx.globalAlpha=front?.38:.25+f.s*.09;
if(front&&i%3===0){ctx.save();ctx.translate(x,y);ctx.rotate(now*.2+f.phase);ctx.lineWidth=1;ctx.beginPath();for(let j=0;j<6;j++){const a=j*Math.PI/3,xx=Math.cos(a)*size*1.7,yy=Math.sin(a)*size*1.7;ctx.moveTo(0,0);ctx.lineTo(xx,yy);for(const sign of [-1,1]){ctx.moveTo(xx*.6,yy*.6);ctx.lineTo(xx*.6+Math.cos(a+sign*.8+Math.PI)*size*.45,yy*.6+Math.sin(a+sign*.8+Math.PI)*size*.45)}}ctx.stroke();ctx.restore()}
else {ctx.beginPath();ctx.ellipse(x,y,size*.8,size*(storm?1.8:1),-.35,0,6.28);ctx.fill()}}
ctx.globalAlpha=1}
function render(ts){const dt=Math.min((ts-(last||ts))/1000,.05);last=ts;if(!paused){now+=dt;if(!pointers.size){if(rotating)angle+=dt*(.12+speed*.95);angle+=velocity*dt;velocity*=Math.exp(-dt*3)}}zoom+=(targetZoom-zoom)*Math.min(1,dt*12);ctx.clearRect(0,0,w,h);
drawSnow(false,dt);
ctx.save();const anchor=top+th*.55;ctx.translate(cx,anchor);ctx.scale(zoom,zoom);ctx.translate(-cx,-anchor);
ctx.globalCompositeOperation='lighter';
atmosphere();orbit(false);
const ground=ctx.createRadialGradient(0,0,0,0,0,radius*1.25);ground.addColorStop(0,'#4da6ff24');ground.addColorStop(1,'#3b8fff00');ctx.globalAlpha=1;ctx.fillStyle=ground;ctx.save();ctx.translate(cx,top+th+15);ctx.scale(1,.22);ctx.fillRect(-radius*1.3,-radius*1.3,radius*2.6,radius*2.6);ctx.restore();
for(let i=0;i<3;i++){ctx.globalAlpha=.14-i*.03;ctx.strokeStyle='#4da6ff';ctx.lineWidth=.7;ctx.beginPath();ctx.ellipse(cx,top+th+14,radius*(1.05+i*.13),radius*(.17+i*.025),0,0,6.28);ctx.stroke()}
// Branches have tiered skirts rather than a perfectly smooth cone.
for(let layer=0;layer<9;layer++){const v=(layer+1)/9;ctx.strokeStyle=layer%2?'#4da6ff':'#2e6fff';ctx.lineWidth=.6;ctx.globalAlpha=.16;ctx.beginPath();for(let j=0;j<=100;j++){const q=project(v,j/100*Math.PI*2,.96);if(j===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)}ctx.stroke()}
for(const p of dots){const q=project(p.v,p.theta,p.r);const flicker=.65+.35*Math.sin(now*1.3+p.phase);glow(q.x,q.y,p.size*(q.z*.25+1)*2.8,(.18+(q.z+1)*.14)*flicker);if(p.phase>6){ctx.globalAlpha=.7*flicker;ctx.fillStyle='#e6f6ff';ctx.fillRect(q.x,q.y,1.1,1.1)}}
// Multiple flowing fairy-light ribbons, with a fine bright core.
for(let ribbon=0;ribbon<3;ribbon++){ctx.strokeStyle=ribbon===1?'#bfe3ff':'#4da6ff';ctx.lineWidth=ribbon===0?1.1:.6;ctx.globalAlpha=.36;ctx.beginPath();for(let i=0;i<=280;i++){const v=i/280,q=project(v,v*Math.PI*2*4.6+ribbon*2.094+now*.18,1.045);if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)}ctx.stroke();for(let i=0;i<240;i++){const v=i/240,q=project(v,v*Math.PI*2*4.6+ribbon*2.094+now*.18,1.045);glow(q.x,q.y,ribbon===0?3.4:2.6,.3+(q.z+1)*.15)}}
// Sparks travel upward along the outside of the tree.
for(let i=0;i<110;i++){const v=1-((now*.065+i/110)%1),q=project(v,i*2.399+now*.25,1.08);glow(q.x,q.y,2.5+Math.sin(i)*1.2,.55)}
for(let i=0;i<46;i++){const v=.15+i/55,q=project(v,i*2.399,1.03),pulse=.75+.25*Math.sin(now*2+i);glow(q.x,q.y,9,pulse*.45);glow(q.x,q.y,3.5,pulse);if(i%5===0){ctx.globalAlpha=.6;ctx.strokeStyle='#e6f6ff';ctx.lineWidth=.65;ctx.beginPath();ctx.moveTo(q.x-6,q.y);ctx.lineTo(q.x+6,q.y);ctx.moveTo(q.x,q.y-6);ctx.lineTo(q.x,q.y+6);ctx.stroke()}}
orbit(true);
ctx.globalAlpha=1;star(cx,top-13);ctx.restore();ctx.globalCompositeOperation='lighter';
for(let i=bursts.length-1;i>=0;i--){const b=bursts[i];if(!paused){b.life-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=18*dt}if(b.life<=0){bursts.splice(i,1);continue}glow(b.x,b.y,b.size,Math.min(1,b.life)*.8)}
ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';drawSnow(true,dt);requestAnimationFrame(render)}
function burst(x,y,count=40){if(reduced)return;for(let i=0;i<count;i++){const a=random(0,6.28),s=random(15,100);bursts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,life:random(.7,2),size:random(2,6)})}if(bursts.length>450)bursts.splice(0,bursts.length-450)}
const $=id=>document.getElementById(id);
const defaultHint='拖动旋转 · 滚轮 / 双指缩放 · 轻触洒落星光';
function setZoom(value){targetZoom=Math.max(.5,Math.min(2.7,value));$('zoomValue').value=Math.round(targetZoom*100)+'%'}
function distance(){const a=[...pointers.values()];return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});startPoint={x:e.clientX,y:e.clientY};dragged=pointers.size>1;pinch=distance();velocity=0});
canvas.addEventListener('pointermove',e=>{const old=pointers.get(e.pointerId);if(!old)return;const dx=e.clientX-old.x,dy=e.clientY-old.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>1){const d=distance();if(pinch>0)setZoom(targetZoom*d/pinch);pinch=d;dragged=true}else{angle+=dx*.009;tilt=Math.max(-.3,Math.min(.4,tilt+dy*.0015));velocity=dx*.04;if(startPoint&&Math.hypot(e.clientX-startPoint.x,e.clientY-startPoint.y)>6)dragged=true}});
function endPointer(e){if(!pointers.has(e.pointerId))return;if(!dragged&&e.type==='pointerup')burst(e.clientX,e.clientY);pointers.delete(e.pointerId);pinch=distance();if(pointers.size)dragged=true}
canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);canvas.addEventListener('lostpointercapture',endPointer);
canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(targetZoom*Math.exp(-e.deltaY*.001))},{passive:false});
$('zoomIn').onclick=()=>setZoom(targetZoom+.15);$('zoomOut').onclick=()=>setZoom(targetZoom-.15);
$('snow').onclick=e=>{snowOn=!snowOn;e.currentTarget.setAttribute('aria-pressed',snowOn)};
$('rotate').setAttribute('aria-pressed',true);
$('rotate').onclick=e=>{if(paused){paused=false;rotating=true}else rotating=!rotating;velocity=0;e.currentTarget.setAttribute('aria-pressed',rotating)};
$('settings').onclick=()=>{const open=$('panel').hidden;$('panel').hidden=!open;$('settings').setAttribute('aria-expanded',open)};
$('immersive').onclick=()=>{const active=document.body.classList.toggle('immersive');$('immersive').setAttribute('aria-pressed',active)};
function sync(){density=+$('density').value/100;wind=+$('wind').value/100;speed=+$('speed').value/100;brightness=+$('light').value/100;$('densityLabel').textContent=density===0?'无雪':density<.35?'小雪':density<.7?'中雪':density<.95?'大雪':'漫天飞雪';for(const id of ['wind','speed','light'])$(id+'Label').textContent=$(id).value+'%'}
for(const id of ['density','wind','speed','light'])$(id).addEventListener('input',sync);
$('storm').onclick=()=>{paused=false;snowOn=true;$('snow').setAttribute('aria-pressed',true);stormUntil=now+12;message('暴风雪来了！让整个冬夜为你闪耀 ❄',12000)};
$('reset').onclick=()=>{setZoom(1);tilt=0;angle=0;velocity=0;stormUntil=0;rotating=true;paused=false;snowOn=true;$('snow').setAttribute('aria-pressed',true);$('rotate').setAttribute('aria-pressed',rotating);$('density').value=75;$('wind').value=40;$('speed').value=60;$('light').value=100;sync()};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else{document.body.classList.add('immersive');$('immersive').setAttribute('aria-pressed',true);message('当前浏览器不支持全屏，已开启沉浸模式')}}catch{message('当前浏览器无法全屏，可以使用沉浸模式')}};
let wishTimer;function message(text,duration=6000){$('hint').textContent=text;clearTimeout(wishTimer);wishTimer=setTimeout(()=>$('hint').textContent=defaultHint,duration)}
let fireworkTimers=[];$('wish').onclick=()=>{paused=false;for(const timer of fireworkTimers)clearTimeout(timer);fireworkTimers=[];for(let i=0;i<6;i++)fireworkTimers.push(setTimeout(()=>burst(random(w*.18,w*.82),random(h*.3,h*.65),100),i*380));message('愿你所期待的美好，都在慢慢靠近 ♡')};
addEventListener('keydown',e=>{if(e.target.matches('input,button'))return;if(e.key==='+'||e.key==='=')setZoom(targetZoom+.15);if(e.key==='-')setZoom(targetZoom-.15);if(e.key==='ArrowLeft')angle-=.15;if(e.key==='ArrowRight')angle+=.15;if(e.key==='Escape'){$('panel').hidden=true;$('settings').setAttribute('aria-expanded',false)}});
document.addEventListener('visibilitychange',()=>{last=0});sync();requestAnimationFrame(render);
})();
</script>
</body>
</html>
